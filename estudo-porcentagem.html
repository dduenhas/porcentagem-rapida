<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" id="theme-color" content="#f4f1ea">
  <script>
    (function () {
      var theme = "light";
      try {
        var stored = localStorage.getItem("porcentagem_theme");
        if (stored === "light" || stored === "dark") theme = stored;
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <title>Mestre da Porcentagem - Método dos Zeros</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&family=Fraunces:SOFT,opsz,wght@30..70,9..144,500..700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #1c1917;
      --ink-soft: rgba(28, 25, 23, 0.64);
      --ink-faint: rgba(28, 25, 23, 0.38);
      --surface-solid: #fbf9f4;
      --well: #e6e0d4;
      --line: rgba(28, 25, 23, 0.10);
      --accent: #9a3412;
      --accent-fill: #9a3412;
      --accent-ink: #fff8f3;
      --accent-soft: rgba(154, 52, 18, 0.14);
      --ok: #1b7a43;
      --ok-soft: rgba(27, 122, 67, 0.12);
      --bad: #b42318;
      --bad-soft: rgba(180, 35, 24, 0.10);
      --fill: #1c1917;
      --fill-ink: #f4f1ea;
      --bar: rgba(244, 241, 234, 0.8);
      --well-shadow: inset 0 1px 2px rgba(28, 25, 23, 0.16);
      --thumb-highlight: rgba(255, 255, 255, 0.7);
      --thumb-shadow: rgba(28, 25, 23, 0.12);
      --hover: rgba(28, 25, 23, 0.045);
      --radius-card: 14px;
      --radius-field: 12px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --dur: 220ms;
      --dur-slow: 280ms;
      --chart-line: #9a3412;
      --chart-fill: rgba(154, 52, 18, 0.12);
      --chart-point: #1c1917;
      --chart-grid: rgba(28, 25, 23, 0.08);
      --chart-tick: rgba(28, 25, 23, 0.58);
      color-scheme: light;
    }

    html[data-theme="dark"] {
        --paper: #12110f;
        --ink: #f3efe6;
        --ink-soft: rgba(243, 239, 230, 0.66);
        --ink-faint: rgba(243, 239, 230, 0.40);
        --surface-solid: #1c1b19;
        --well: #0e0d0c;
        --line: rgba(243, 239, 230, 0.10);
        --accent: #f0b089;
        --accent-fill: #e39a6e;
        --accent-ink: #2a140c;
        --accent-soft: rgba(224, 138, 93, 0.20);
        --ok: #3dd68c;
        --ok-soft: rgba(61, 214, 140, 0.14);
        --bad: #ff7a70;
        --bad-soft: rgba(255, 122, 112, 0.14);
        --fill: #f3efe6;
        --fill-ink: #1c1917;
        --bar: rgba(18, 17, 15, 0.78);
        --well-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.55);
        --thumb-highlight: rgba(255, 255, 255, 0.08);
        --thumb-shadow: rgba(0, 0, 0, 0.45);
        --hover: rgba(243, 239, 230, 0.045);
        --chart-line: #e39a6e;
        --chart-fill: rgba(227, 154, 110, 0.16);
        --chart-point: #f3efe6;
        --chart-grid: rgba(243, 239, 230, 0.08);
        --chart-tick: rgba(243, 239, 230, 0.62);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding-bottom: 64px;
      font-family: "Atkinson Hyperlegible", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      color: var(--ink);
      background:
        radial-gradient(880px 300px at 50% -140px, var(--accent-soft), transparent 70%),
        var(--paper);
      font-variant-numeric: tabular-nums lining-nums;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select { font-family: inherit; color: inherit; }
    button, select { -webkit-tap-highlight-color: transparent; }

    ::selection {
      background: var(--accent-soft);
      color: var(--ink);
    }

    .display {
      font-family: Fraunces, "Iowan Old Style", Palatino, Georgia, serif;
      font-optical-sizing: auto;
      font-weight: 560;
      font-variation-settings: "SOFT" 40, "opsz" 72, "wght" 560;
    }

    .bar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--bar);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      box-shadow: inset 0 -1px 0 var(--line);
    }

    .bar-inner {
      min-height: 64px;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .logo {
      width: 36px;
      height: 36px;
      flex: none;
    }

    .logo circle { fill: var(--ink); }
    .logo path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .brand {
      font-size: 1.25rem;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      margin-top: 3px;
      font-size: 0.75rem;
      color: var(--ink-soft);
    }

    .segmented {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-width: 236px;
      padding: 3px;
      border-radius: 999px;
      background: var(--well);
      box-shadow: var(--well-shadow);
    }

    .segment-thumb {
      position: absolute;
      z-index: 0;
      top: 3px;
      bottom: 3px;
      left: 3px;
      width: calc(50% - 3px);
      border-radius: 999px;
      background: var(--surface-solid);
      box-shadow:
        0 1px 2px var(--thumb-shadow),
        inset 0 1px 0 var(--thumb-highlight);
      transition: transform var(--dur-slow) var(--ease);
    }

    .segmented.is-analise .segment-thumb { transform: translateX(100%); }

    .segment {
      position: relative;
      z-index: 1;
      height: 38px;
      padding: 0 16px;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--ink-soft);
      font-size: 0.875rem;
      font-weight: 400;
      cursor: pointer;
    }

    .segment.is-on { color: var(--ink); font-weight: 700; }

    .segment:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .bar-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 14px 0 12px;
      border: 0;
      border-radius: 999px;
      background: var(--well);
      color: var(--ink);
      box-shadow: var(--well-shadow);
      font-size: 0.875rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 180ms var(--ease), filter 180ms var(--ease);
    }

    .theme-toggle:hover { filter: brightness(1.06); }
    .theme-toggle:active { transform: scale(0.98); }

    .theme-toggle:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .theme-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .theme-icon-moon { fill: currentColor; stroke: none; }

    .theme-icon-sun { display: none; }

    html[data-theme="dark"] .theme-icon-sun { display: block; }
    html[data-theme="dark"] .theme-icon-moon { display: none; }

    .theme-label-escuro { display: none; }

    html[data-theme="light"] .theme-label-claro { display: none; }
    html[data-theme="light"] .theme-label-escuro { display: inline; }

    @media (max-width: 420px) {
      .theme-label {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      .theme-toggle {
        width: 44px;
        padding: 0;
      }
    }

    .page { margin-top: 28px; }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sheet {
      background: var(--surface-solid);
      border-radius: var(--radius-card);
      box-shadow: 0 0 0 1px var(--line);
      padding: 20px;
    }

    .lesson-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
    }

    .field-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    .select-wrap {
      position: relative;
      min-width: min(100%, 340px);
      flex: 1 1 280px;
    }

    .select {
      appearance: none;
      width: 100%;
      height: 44px;
      padding: 0 40px 0 14px;
      border: 0;
      border-radius: var(--radius-field);
      background: var(--well);
      box-shadow: var(--well-shadow);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: box-shadow var(--dur) var(--ease);
    }

    .select:focus-visible {
      outline: none;
      box-shadow: var(--well-shadow), 0 0 0 4px var(--accent-soft);
    }

    .chevron {
      position: absolute;
      right: 14px;
      bottom: 16px;
      width: 12px;
      height: 12px;
      fill: var(--ink-soft);
      pointer-events: none;
    }

    .score-badge {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      min-height: 44px;
      padding: 8px 14px;
      border-radius: 12px;
    }

    .score-badge.is-ok { color: var(--ok); background: var(--ok-soft); }
    .score-badge.is-mid { color: var(--accent); background: var(--accent-soft); }

    .score-badge-value {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .score-badge-meta {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--ink-soft);
    }

    .tip {
      --tip-bg: color-mix(in srgb, var(--accent) 8%, var(--surface-solid));
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--tip-bg);
    }

    .cut {
      position: relative;
      flex: none;
      width: 36px;
      height: 3px;
      margin-top: 27px;
      border-radius: 3px;
      background: var(--accent);
    }

    .cut i {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 0;
      transform: translateX(-50%);
      background: var(--tip-bg);
      transition: width 320ms var(--ease);
    }

    .tip.is-cut .cut i { width: 5px; }

    .tip-kicker {
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    .tip-title {
      margin-top: 2px;
      font-size: 1.2rem;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .tip-text {
      margin-top: 6px;
      font-size: 0.9375rem;
      line-height: 1.45;
      color: var(--ink-soft);
    }

    .q-card {
      display: flex;
      flex-direction: column;
      padding: 16px 18px 18px;
      border-radius: var(--radius-card);
      background: var(--surface-solid);
      box-shadow: 0 0 0 1px var(--line);
      animation: rise 340ms var(--ease) both;
      transition: background var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }

    .q-card:hover:not(.is-correct):not(.is-wrong) {
      box-shadow: 0 0 0 1px var(--line), 0 10px 24px var(--hover);
    }

    .q-card.is-correct {
      background: color-mix(in srgb, var(--ok) 10%, var(--surface-solid));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--ok) 45%, transparent);
    }

    .q-card.is-wrong {
      background: color-mix(in srgb, var(--bad) 9%, var(--surface-solid));
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--bad) 42%, transparent);
    }

    .q-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 24px;
    }

    .q-index {
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    .q-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
    }

    .q-eq {
      flex: 1;
      min-width: 0;
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .mark {
      color: var(--accent);
      font-family: Fraunces, Palatino, Georgia, serif;
      font-weight: 560;
      font-variation-settings: "SOFT" 50, "opsz" 48, "wght" 560;
    }

    .well {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      width: 9.5rem;
      height: 52px;
      padding: 0 14px 0 12px;
      border-radius: var(--radius-field);
      background: var(--well);
      box-shadow: var(--well-shadow);
      transition: box-shadow 240ms var(--ease);
    }

    .well-prefix {
      margin-right: 8px;
      color: var(--ink-faint);
      font-weight: 700;
    }

    .well-input {
      width: 100%;
      min-width: 0;
      padding: 0 0 6px;
      border: 0;
      background: transparent;
      text-align: right;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .well-input::placeholder {
      color: var(--ink-faint);
      font-weight: 400;
    }

    .well-input:focus { outline: none; }

    .well-line {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 8px;
      height: 2px;
      border-radius: 2px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform var(--dur-slow) var(--ease), background var(--dur) var(--ease);
    }

    .well:focus-within {
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .well:focus-within .well-line { transform: scaleX(1); }

    .q-card.is-wrong .well {
      box-shadow: inset 0 0 0 1.5px var(--bad);
    }

    .q-card.is-wrong .well:focus-within {
      box-shadow: inset 0 0 0 1.5px var(--bad), 0 0 0 4px var(--bad-soft);
    }

    .q-card.is-wrong .well-line {
      background: var(--bad);
      transform: scaleX(1);
    }

    .q-card.is-correct .well {
      box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ok) 70%, transparent);
    }

    .q-card.is-correct .well:focus-within {
      box-shadow:
        inset 0 0 0 1.5px color-mix(in srgb, var(--ok) 70%, transparent),
        0 0 0 4px var(--ok-soft);
    }

    .q-card.is-correct .well:focus-within .well-line {
      background: var(--ok);
      transform: scaleX(1);
    }

    .q-feedback {
      max-height: 0;
      margin-top: 0;
      padding-top: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(4px);
      font-size: 0.875rem;
      line-height: 1.45;
      color: var(--ink-soft);
      transition:
        max-height var(--dur-slow) var(--ease),
        opacity var(--dur) var(--ease),
        transform var(--dur-slow) var(--ease),
        margin-top var(--dur-slow) var(--ease),
        padding-top var(--dur-slow) var(--ease);
    }

    .q-card.is-correct .q-feedback,
    .q-card.is-wrong .q-feedback {
      max-height: 8rem;
      margin-top: 14px;
      padding-top: 12px;
      opacity: 1;
      transform: none;
      box-shadow: inset 0 1px 0 var(--line);
    }

    .fb-label { font-weight: 700; color: var(--ink); }
    .q-card.is-correct .fb-label { color: var(--ok); }
    .q-card.is-wrong .fb-label { color: var(--bad); }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.is-ok { color: var(--ok); background: var(--ok-soft); }
    .pill.is-bad { color: var(--bad); background: var(--bad-soft); }
    .pill.is-mid { color: var(--accent); background: var(--accent-soft); }
    .pill.is-quiet { color: var(--ink-soft); background: var(--well); }

    .draw {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .draw path {
      stroke-dasharray: 22;
      stroke-dashoffset: 22;
      animation: draw 320ms var(--ease) forwards;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .actions-main {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 999px;
      font-size: 0.9375rem;
      font-weight: 700;
      cursor: pointer;
      transition:
        transform 180ms var(--ease),
        filter 180ms var(--ease),
        background 180ms var(--ease),
        color 180ms var(--ease);
    }

    .btn-primary {
      background: var(--accent-fill);
      color: var(--accent-ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 1px 2px rgba(28, 25, 23, 0.12);
    }

    .btn-fill {
      background: var(--fill);
      color: var(--fill-ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    .btn-primary:hover,
    .btn-fill:hover { filter: brightness(1.06); }

    .btn-primary:active,
    .btn-fill:active { transform: scale(0.98); }

    .btn-quiet {
      padding: 0 12px;
      background: transparent;
      color: var(--ink-soft);
      box-shadow: none;
    }

    .btn-quiet:hover {
      color: var(--ink);
      background: var(--hover);
    }

    .btn-danger:hover {
      color: var(--bad);
      background: var(--bad-soft);
    }

    .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .stat {
      padding: 16px 18px 14px;
      border-radius: var(--radius-card);
      background: var(--surface-solid);
      box-shadow: 0 0 0 1px var(--line);
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .stat-value.is-accent { color: var(--accent); }

    .stat-label {
      margin-top: 6px;
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    .sheet-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .sheet-title {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .sheet-sub {
      margin-top: 2px;
      font-size: 0.8125rem;
      color: var(--ink-soft);
    }

    .chart-frame { height: 16rem; }
    @media (min-width: 640px) {
      .chart-frame { height: 18rem; }
    }

    .table-scroll { overflow-x: auto; margin: 4px -20px -20px; }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9375rem;
    }

    .history-table th {
      padding: 12px 16px;
      background: color-mix(in srgb, var(--ink) 3%, var(--surface-solid));
      color: var(--ink-soft);
      font-size: 0.8125rem;
      font-weight: 400;
      text-align: left;
    }

    .history-table td {
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      vertical-align: middle;
    }

    .history-table tbody tr { transition: background 180ms var(--ease); }
    .history-table tbody tr:hover { background: var(--hover); }

    .col-strong { font-weight: 700; }
    .col-soft { color: var(--ink-soft); font-size: 0.875rem; }
    .col-muted { color: var(--ink-faint); }
    .col-mid { text-align: center; }
    .col-end { text-align: right; }
    .col-num {
      text-align: center;
      font-weight: 700;
      white-space: nowrap;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .sheet-title-pad {
      padding: 0 0 14px;
      box-shadow: inset 0 -1px 0 var(--line);
      margin: -4px 0 0;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    @keyframes draw { to { stroke-dashoffset: 0; } }

      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === "suspended") audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    }

    window.addEventListener("DOMContentLoaded", () => {
      syncThemeControl();
      populateLessonSelect();
      loadLesson(1);
      renderAnalytics();
      const themeMq = window.matchMedia("(prefers-color-scheme: dark)");
      const onTheme = () => {
        let stored = null;
        try { stored = localStorage.getItem("porcentagem_theme"); } catch (e) {}
        if (stored === "light" || stored === "dark") return;
        document.documentElement.setAttribute("data-theme", themeMq.matches ? "dark" : "light");
        syncThemeControl();
        renderAnalytics();
      };
      if (themeMq.addEventListener) themeMq.addEventListener("change", onTheme);
      else if (themeMq.addListener) themeMq.addListener(onTheme);
    });

    function switchTab(tab) {
      const tabEx = document.getElementById("tab-exercicios");
      const tabAn = document.getElementById("tab-analise");
      const btnEx = document.getElementById("tab-exercicios-btn");
      const btnAn = document.getElementById("tab-analise-btn");
      const showEx = tab === "exercicios";

      tabEx.classList.toggle("hidden", !showEx);
      tabAn.classList.toggle("hidden", showEx);
      document.getElementById("segmented").classList.toggle("is-analise", !showEx);
      btnEx.classList.toggle("is-on", showEx);
      btnAn.classList.toggle("is-on", !showEx);
      btnEx.setAttribute("aria-selected", showEx ? "true" : "false");
      btnAn.setAttribute("aria-selected", showEx ? "false" : "true");

      const panel = showEx ? tabEx : tabAn;
      panel.classList.remove("is-entering");
      void panel.offsetWidth;
      panel.classList.add("is-entering");

      if (!showEx) renderAnalytics();
    }

    function populateLessonSelect() {
      const select = document.getElementById("lesson-select");
      select.innerHTML = "";
      lessonsData.forEach(l => {
        const opt = document.createElement("option");
        opt.value = l.id;
        opt.textContent = l.title;
        select.appendChild(opt);
      });
    }

    function loadLesson(id) {
      currentLessonId = parseInt(id, 10);
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      document.getElementById("lesson-select").value = currentLessonId;
      document.getElementById("tip-title").textContent = lesson.title;
      document.getElementById("tip-text").textContent = lesson.tip;
      document.getElementById("btn-next-label").textContent = currentLessonId < 10 ? "Próxima aula" : "Ver progresso";
      replayCut();

      const container = document.getElementById("questions-container");
      container.innerHTML = "";

      const saved = userProgress[currentLessonId] || null;
      updateLessonBadge(saved);

      lesson.questions.forEach((q, idx) => {
        const userAns = saved ? (saved.answers[idx] || "") : "";
        const card = document.createElement("article");
        card.id = `q-card-${idx}`;
        card.className = "q-card";
        card.style.animationDelay = `${idx * 35}ms`;
        card.innerHTML = `
          <div class="q-card-top">
            <span class="q-index">Questão ${idx + 1} de 10</span>
            <span id="badge-${idx}" class="pill is-quiet" hidden></span>
          </div>
          <div class="q-row">
            <p class="q-eq">${formatQuestion(q.q)}</p>
            <label class="well">
              <span class="well-prefix" aria-hidden="true">=</span>
              <input
                type="text"
                inputmode="decimal"
                placeholder="0,00"
                id="input-${idx}"
                value="${esc(userAns)}"
                class="well-input"
                aria-label="Resposta para ${esc(q.q)}"
                autocomplete="off"
                spellcheck="false"
              />
              <span class="well-line" aria-hidden="true"></span>
            </label>
          </div>
          <div id="feedback-${idx}" class="q-feedback"></div>
        `;
        container.appendChild(card);
      });

      if (saved) {
        showResults(saved);
        document.getElementById("btn-next").classList.remove("hidden");
      } else {
        document.getElementById("btn-next").classList.add("hidden");
      }
    }

    function normalizeInput(val) {
      return (val || "")
        .trim()
        .replace(/\s+/g, "")
        .replace(".", ",");
    }

    function submitLesson() {
      const lesson = lessonsData.find(l => l.id === currentLessonId);
      const answers = [];
      let correctCount = 0;

      lesson.questions.forEach((q, idx) => {
        const inp = document.getElementById(`input-${idx}`);
        const userValue = normalizeInput(inp.value);
        answers.push(userValue);
        if (userValue === normalizeInput(q.a)) correctCount++;
      });

      userProgress[currentLessonId] = {
        answers: answers,
        score: correctCount,
        total: 10,
        date: new Date().toLocaleDateString("pt-BR")
      };
      localStorage.setItem("porcentagem_progress", JSON.stringify(userProgress));

      if (correctCount >= 8) {
        playTone(587.33, 0.1);
        setTimeout(() => playTone(880, 0.25), 100);
      } else {
        playTone(330, 0.25, "triangle");
      }

      showResults(userProgress[currentLessonId]);
      updateLessonBadge(userProgress[currentLessonId]);
      document.getElementById("btn-next").classList.remove("hidden");
    }

    function showResults(data) {
      const lesson = lessonsData.find(l => l.id === currentLessonId);

      lesson.questions.forEach((q, idx) => {
        const card = document.getElementById(`q-card-${idx}`);
        const badge = document.getElementById(`badge-${idx}`);
        const fb = document.getElementById(`feedback-${idx}`);
        const userValue = normalizeInput(data.answers[idx]);
        const expected = normalizeInput(q.a);
        const ok = userValue === expected;

        card.classList.toggle("is-correct", ok);
        card.classList.toggle("is-wrong", !ok);
        badge.hidden = false;

        if (ok) {
          badge.className = "pill is-ok";
          badge.innerHTML = '<svg class="draw" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7.5"></path></svg> Correto';
          fb.innerHTML = `<span class="fb-label">Técnica.</span> ${esc(q.exp)}`;
        } else {
          badge.className = "pill is-bad";
          badge.textContent = `Resposta: ${q.a}`;
          fb.innerHTML = `<span class="fb-label">Passo a passo.</span> ${esc(q.exp)}`;
        }
      });
    }

    function updateLessonBadge(saved) {
      const badgeBox = document.getElementById("lesson-badge");
      if (saved) {
        const pct = saved.score * 10;
        const tone = saved.score >= 8 ? "is-ok" : "is-mid";
        badgeBox.innerHTML = `
          <div class="score-badge ${tone}">
            <span class="score-badge-value">${saved.score}/10</span>
            <span class="score-badge-meta">${pct}% · ${esc(saved.date)}</span>
          </div>
        `;
      } else {
        badgeBox.innerHTML = '<span class="pill is-quiet">Pendente</span>';
      }
    }

    function nextLesson() {
      if (currentLessonId < 10) {
        loadLesson(currentLessonId + 1);
        window.scrollTo({ top: 0, behavior: "smooth" });
      } else {
        switchTab("analise");
      }
    }

    function clearCurrentLesson() {
      if (confirm("Deseja limpar as respostas desta aula?")) {
        delete userProgress[currentLessonId];
        localStorage.setItem("porcentagem_progress", JSON.stringify(userProgress));
        loadLesson(currentLessonId);
      }
    }

    function renderAnalytics() {
      let completed = 0;
      let totalCorrect = 0;
      const scores = [];
      const labels = [];

      for (let i = 1; i <= 10; i++) {
        labels.push(`Dia ${i}`);
        const p = userProgress[i];
        if (p) {
          completed++;
          totalCorrect += p.score;
          scores.push(p.score);
        } else {
          scores.push(null);
        }
      }

      const totalAttempted = completed * 10;
      const acc = totalAttempted > 0 ? Math.round((totalCorrect / totalAttempted) * 100) : 0;
      const avg = completed > 0 ? (totalCorrect / completed).toFixed(1).replace(".", ",") : "0,0";

      document.getElementById("stat-completed").textContent = `${completed} / 10`;
      document.getElementById("stat-accuracy").textContent = `${acc}%`;
      document.getElementById("stat-total-correct").textContent = `${totalCorrect} / 100`;
      document.getElementById("stat-avg").textContent = avg;

      const ctx = document.getElementById("progressChart").getContext("2d");
      if (chartInstance) chartInstance.destroy();

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const tickFont = { family: '"Atkinson Hyperlegible", sans-serif', size: 12 };

      chartInstance = new Chart(ctx, {
        type: "line",
        data: {
          labels: labels,
          datasets: [{
            label: "Acertos",
            data: scores,
            borderColor: readToken("--chart-line"),
            backgroundColor: readToken("--chart-fill"),
            borderWidth: 2.5,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: readToken("--chart-point"),
            pointBorderColor: readToken("--chart-line"),
            pointBorderWidth: 2,
            pointRadius: 4,
            pointHoverRadius: 6,
            spanGaps: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: reduceMotion ? false : { duration: 480, easing: "easeOutQuart" },
          scales: {
            y: {
              min: 0,
              max: 10,
              grid: { color: readToken("--chart-grid") },
              border: { display: false },
              ticks: { color: readToken("--chart-tick"), stepSize: 2, font: tickFont }
            },
            x: {
              grid: { display: false },
              border: { display: false },
              ticks: { color: readToken("--chart-tick"), font: tickFont }
            }
          },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: readToken("--ink"),
              titleColor: readToken("--paper"),
              bodyColor: readToken("--paper"),
              padding: 10,
              cornerRadius: 10,
              displayColors: false,
              callbacks: {
                label: (item) => `Acertos: ${item.parsed.y} de 10 (${item.parsed.y * 10}%)`
              }
            }
          }
        }
      });

      const tbody = document.getElementById("history-table-body");
      tbody.innerHTML = "";

      lessonsData.forEach(l => {
        const p = userProgress[l.id];
        const tr = document.createElement("tr");
        const focus = esc((l.title.split(": ")[1] || l.title));

        if (p) {
          const pct = p.score * 10;
          const tone = p.score >= 8 ? "is-ok" : "is-mid";
          tr.innerHTML = `
            <td class="col-strong">Dia ${l.id}</td>
            <td class="col-soft">${focus}</td>
            <td class="col-num">${p.score}&nbsp;/&nbsp;10</td>
            <td class="col-mid"><span class="pill ${tone}">${pct}%</span></td>
            <td class="col-end"><button type="button" class="btn btn-quiet" onclick="goToLesson(${l.id})">Refazer</button></td>
          `;
        } else {
          tr.innerHTML = `
            <td class="col-muted">Dia ${l.id}</td>
            <td class="col-muted">${focus}</td>
            <td class="col-mid col-muted">—</td>
            <td class="col-mid"><span class="pill is-quiet">Não feito</span></td>
            <td class="col-end"><button type="button" class="btn btn-quiet" onclick="goToLesson(${l.id})">Iniciar</button></td>
          `;
        }
        tbody.appendChild(tr);
      });
    }

    function goToLesson(id) {
      switchTab("exercicios");
      loadLesson(id);
    }

    function resetAllProgress() {
      if (confirm("Atenção: deseja zerar todo o histórico dos 10 dias? Essa ação não pode ser desfeita.")) {
        localStorage.removeItem("porcentagem_progress");
        userProgress = {};
        renderAnalytics();
        loadLesson(currentLessonId);
      }
    }
  </script>
</body>
</html>
